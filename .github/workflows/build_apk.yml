name: Build Galaxy Fold Comic Viewer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Fresh Android Scaffolding
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.example --project-name=fold_comic_viewer

      - name: Configure compileSdk 36 & Android Permissions
        run: |
          # 1. Inject storage permissions to AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>' android/app/src/main/AndroidManifest.xml

          # 2. Force compileSdk 36 on all subproject plugins (file_picker, permission_handler, etc.)
          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              afterEvaluate {
                  if (plugins.hasPlugin("com.android.application") || plugins.hasPlugin("com.android.library")) {
                      configure<com.android.build.gradle.BaseExtension> {
                          compileSdkVersion(36)
                      }
                  }
              }
          }
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foldcomic-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
